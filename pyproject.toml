[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drishtinav"
version = "1.0.0"
description = "AI-ML intelligent dead reckoning with seamless GNSS + INS fusion (ISRO / SIH 2026, PS 26168)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "flask>=3.0"]

[project.optional-dependencies]
train = ["torch>=2.2", "onnx>=1.15", "matplotlib>=3.7", "pytest>=8"]

[project.scripts]
drishtinav = "drishtinav.cli:main"

[tool.setuptools.packages.find]
include = ["drishtinav*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning"]
